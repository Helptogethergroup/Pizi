<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pizi — Razorpay Test Checkout</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 40px auto; }
    input { width: 100%; padding: 8px; margin: 6px 0 14px; box-sizing: border-box; }
    button { padding: 10px 20px; background: #ff5a4e; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    pre { background: #f4f4f4; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <h2>Razorpay Test Checkout (Step 3 helper)</h2>
  <p>Step 2 (Postman /owner/credits/order) ka response yahan daal ke "Pay" dabao.</p>

  <label>Key ID (rzp_test_... ya rzp_live_...)</label>
  <input id="keyId" placeholder="RAZORPAY_KEY_ID">

  <label>Order ID (Step 2 response se)</label>
  <input id="orderId" placeholder="order_XXXXXXXXXXXX">

  <label>Amount (paise mein, Step 2 response se)</label>
  <input id="amount" placeholder="999900">

  <button onclick="pay()">Pay</button>

  <h3>Result (yeh Postman verify call mein daalo):</h3>
  <pre id="result">— abhi payment nahi hua —</pre>

  <script>
    function pay() {
      const options = {
        key: document.getElementById('keyId').value.trim(),
        order_id: document.getElementById('orderId').value.trim(),
        amount: document.getElementById('amount').value.trim(),
        currency: 'INR',
        name: 'Pizi Test',
        description: 'Package purchase test',
        handler: function (response) {
          document.getElementById('result').textContent = JSON.stringify({
            razorpay_order_id: response.razorpay_order_id,
            razorpay_payment_id: response.razorpay_payment_id,
            razorpay_signature: response.razorpay_signature
          }, null, 2);
        },
        theme: { color: '#ff5a4e' }
      };
      const rzp = new Razorpay(options);
      rzp.open();
    }
  </script>
</body>
</html>
